<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智慧农业播种收割RAG助手</title>
    <link rel="stylesheet" href="/static/style.css">
    <link rel="icon" href="static/favicon.ico" type="image/x-icon">
</head>
<body>
    <div class="app" id="app-container">
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <h2>config</h2>
            </div>
            <button id="load-btn" class="btn-primary">加载知识库文档</button>
            <button id="clear-memory-btn" class="btn-primary btn-secondary">清空对话记忆</button>
            <div class="sidebar-divider"></div>
            <div class="user-id-section">
                <label for="user-id-input" class="user-id-label">用户ID (4位数字)</label>
                <div class="user-id-row">
                    <input type="text" id="user-id-input" class="user-id-field" maxlength="4" placeholder="1001" value="1001">
                    <button id="set-user-id-btn" class="btn-primary btn-compact">变更</button>
                </div>
                <span id="user-id-status" class="user-id-status"></span>
            </div>
            <div id="load-status" class="status-text"></div>
        </aside>
        <button id="sidebar-toggle" class="sidebar-toggle" title="收起侧边栏">
            <svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2" fill="none">
                <polyline points="15,18 9,12 15,6"></polyline>
            </svg>
        </button>
        <main class="main">
            <header class="main-header">
                <h1>智慧农业播种收割RAG助手</h1>
            </header>
            <div class="divider"></div>
            <div id="chat-container" class="chat-container"></div>
            <div class="input-area">
                <div class="input-wrapper">
                    <input type="text" id="chat-input" placeholder="请输入您的问题..." autocomplete="off">
                    <button id="send-btn" class="send-btn" aria-label="发送">
                        <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none">
                            <line x1="22" y1="2" x2="11" y2="13"></line>
                            <polygon points="22,2 15,22 11,13 2,9 22,2"></polygon>
                        </svg>
                    </button>
                </div>
            </div>
        </main>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="/static/app.js"></script>
</body>
</html>
